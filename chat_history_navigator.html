    let activeCategory = 'all';

    function renderPills() {
      let html = `<button class="pill active" onclick="setCategory('all')">🌟 All Categories <span class="pill-count">${DATA.conversations.length}</span></button>`;
      
      DATA.categories.forEach(cat => {
        const count = (DATA.grouped[cat.id] || []).length;
        html += `<button class="pill" data-cat="${cat.id}" onclick="setCategory('${cat.id}')">
          <span>${cat.emoji} ${cat.name}</span>
          <span class="pill-count">${count}</span>
        </button>`;
      });
      pillsContainer.innerHTML = html;
    }

    function setCategory(catId) {
      activeCategory = catId;
      document.querySelectorAll('.pill').forEach(el => {
        if ((catId === 'all' && !el.dataset.cat) || el.dataset.cat === catId) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
      renderCards();
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert('Conversation ID copied to clipboard: ' + text);
    }

    function renderCards() {
      const filtered = DATA.conversations.filter(c => {
        const matchesCat = (activeCategory === 'all') || (c.category_id === activeCategory);
        if (!matchesCat) return false;
        
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const text = (c.title + ' ' + c.id + ' ' + (c.prompts || []).join(' ')).toLowerCase();
        return text.includes(q);
      });

      statsBadge.textContent = `${filtered.length} of ${DATA.conversations.length} Chats Shown`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><h3>No conversations match your search</h3><p>Try clearing filters or changing search keywords.</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const cat = DATA.categories.find(k => k.id === c.category_id) || { color: '#38bdf8', emoji: '💬', name: 'General' };
        const promptsHtml = (c.prompts && c.prompts.length > 0)
          ? c.prompts.map((p, idx) => `<div><strong style="color: #38bdf8;">#${idx+1}:</strong> ${escapeHtml(p)}</div>`).join('')
          : '<div><em>No user prompt recorded in session</em></div>';

        return `
          <div class="chat-card">

              <div class="chat-card-top">

                  ${cat.emoji} ${cat.name}
                </span>
                <span class="date-tag">${c.date}</span>
              </div>
              <div class="chat-title">${escapeHtml(c.title)}</div>
              <div class="prompts-list">
                ${promptsHtml}
              </div>
            </div>
            <div class="chat-actions">
              <span class="cid-badge" title="Full ID: ${c.id}">ID: ${c.id.substring(0, 8)}</span>
              <div class="action-links">

                <a class="btn-link" href="${c.log_link}" target="_blank" title="View Full Transcript Logs">📜 Transcript</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
