[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Real bugs only: syntax errors, undefined names, unused imports/variables.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
